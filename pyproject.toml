[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty100-etl"
version = "0.1.0"
description = "Sprint 1 Nifty 100 Excel ingestion and SQLite validation pipeline"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"